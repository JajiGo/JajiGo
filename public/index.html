<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7a4f">
<title>JajiGo</title>
<style>
:root{--g:#0e7a4f;--g2:#0a5c3b;--g3:#e7f4ee;--o:#e2574c;--ink:#1c2420;--mut:#6b7770;--bg:#f7fbf8;--card:#fff;--line:#e4e2da;--gold:#f4b53f;--r:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#f7fbf8}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:78px;min-height:100vh;overflow-x:hidden;
background:radial-gradient(ellipse 90% 42% at -10% 12%,rgba(22,163,74,.11),transparent 72%),radial-gradient(ellipse 85% 38% at 112% 32%,rgba(14,122,79,.09),transparent 74%),linear-gradient(180deg,#fff,#f7fbf8 48%,#fff);background-attachment:fixed}
header{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;position:sticky;top:0;z-index:20}
.logo{font-size:24px;font-weight:800;letter-spacing:-1.2px;line-height:1}.logo .j{color:#fff}.logo .go{color:#86efac;position:relative}
.logo .go:after{content:'\27A4';position:absolute;color:#ff9a3d;font-size:.36em;right:.03em;top:-.78em;transform:rotate(-18deg)}
.loc{font-size:12.5px;opacity:.92;margin-top:3px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.searchwrap{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.searchbar{display:flex;align-items:center;background:#fff;border-radius:12px;padding:0 12px;height:46px;gap:8px}
.searchbar input{border:none;outline:none;flex:1;font-size:15px;height:100%;background:transparent;color:var(--ink)}
main{padding:14px 14px 20px;max-width:560px;margin:0 auto}
h2.sec{font-size:16.5px;font-weight:800;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:0 8px 24px rgba(14,122,79,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 6px;text-align:center;cursor:pointer;box-shadow:0 8px 24px rgba(14,122,79,.06)}
.cat.on{border-color:var(--g);background:var(--g3)}.cat:active{transform:scale(.97)}.cat .ci{font-size:26px}.cat .cn{font-size:12.5px;font-weight:600;margin-top:4px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 24px rgba(14,122,79,.06)}
.pimg{height:120px;display:flex;align-items:center;justify-content:center;font-size:44px;background:#f3f0e8;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:9px 10px 11px}.pname{font-size:13.5px;font-weight:700;line-height:1.25}.psub{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pprice{font-size:14px;font-weight:800;color:var(--g);margin:4px 0 7px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px;display:flex;gap:11px;align-items:center;margin-bottom:10px;color:inherit;text-decoration:none;box-shadow:0 8px 24px rgba(14,122,79,.06)}
.vlogo{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none;color:#fff;background:var(--g)}.vlogo img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.vname{font-size:14.5px;font-weight:700}.vmeta{font-size:12px;color:var(--mut);margin-top:1px}
.btn{background:linear-gradient(135deg,#16a34a,#0e7a4f 55%,#0a5c3b);color:#fff;border:none;border-radius:14px;height:48px;font-size:15.5px;font-weight:700;width:100%;cursor:pointer;box-shadow:0 8px 18px rgba(14,122,79,.25);font-family:inherit;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.sec{background:var(--g3);color:var(--g);box-shadow:none}.btn.warn{background:var(--o)}.btn.sm{height:36px;font-size:13px;width:auto;padding:0 14px;border-radius:10px}.btn:disabled{opacity:.5}.btn:active{opacity:.85}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.g1{flex:1;min-width:0}
.pill{display:inline-flex;background:var(--g3);color:var(--g);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}.pill.red{background:#fdebe9;color:var(--o)}.pill.amber{background:#fdf3e0;color:#a06514}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;flex:1}.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.tabs2{display:flex;gap:7px;margin-bottom:12px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.field{margin-bottom:12px}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;background:#fff;outline:none;color:var(--ink);font-family:inherit}.field textarea{height:80px;padding:10px 12px}
.field input[type=file]{padding:9px 12px}.field input[type=checkbox]{width:auto;height:auto}
.total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14.5px}.total-row.big{font-weight:800;font-size:17px;border-top:1.5px solid var(--line);margin-top:5px;padding-top:11px}
.stepper{display:flex;align-items:center;gap:2px}.stepper button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:700;color:var(--g)}.stepper span{min-width:34px;text-align:center;font-weight:700}
.statusbar{display:flex;gap:4px;margin:12px 0 6px}.statusbar div{flex:1;height:6px;border-radius:3px;background:var(--line)}.statusbar div.on{background:var(--g)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}.stat .sv{font-size:19px;font-weight:800;color:var(--g)}.stat .sl{font-size:11.5px;color:var(--mut)}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.code{font-size:30px;letter-spacing:8px;text-align:center;font-weight:800;color:var(--g);margin-top:4px}
.mut{color:var(--mut);font-size:13px}.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty .ei{font-size:44px;margin-bottom:8px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;margin:24px auto}@keyframes sp{to{transform:rotate(360deg)}}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:10.5px;color:var(--mut);text-decoration:none}nav.tabs a .ti{font-size:21px;line-height:1}nav.tabs a.on{color:var(--g);font-weight:700}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;max-width:88%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:.95}
.near{background:linear-gradient(135deg,#e7f4ee,#fff);border:1px solid #cfe8da;border-radius:var(--r);padding:13px;margin-bottom:14px}.near a{text-decoration:none;color:var(--ink);flex:none;padding:8px 12px;font-size:12.5px}
.sl{position:relative;margin:0 0 14px;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(14,122,79,.15)}
.slt{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:16/9;-webkit-overflow-scrolling:touch}.slt::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;display:block;overflow:hidden;background:var(--g3)}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1);transition:transform 5s ease-out}.slide.on img{transform:scale(1.06)}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);transition:all .25s}.dots i.on{background:#fff;width:18px;border-radius:4px}

.iconbtn{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:19px;width:40px;height:40px;border-radius:12px;position:relative;cursor:pointer;padding:0}
.badge{position:absolute;top:4px;right:4px;background:var(--o);font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;color:#fff}
.aibtn{background:linear-gradient(135deg,#f4b53f,#e2574c);border:none;color:#fff;font-weight:700;font-size:14.5px;border-radius:12px;height:42px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;width:100%;font-family:inherit}
.jg-greeting{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(231,244,238,.96),rgba(255,255,255,.96));border:1px solid rgba(14,122,79,.12);border-radius:18px;padding:15px 16px;margin:2px 0 16px;box-shadow:0 8px 24px rgba(14,122,79,.07)}
.jg-greet-title{font-size:20px;font-weight:800;color:var(--g2);letter-spacing:-.2px}.jg-greet-sub{margin-top:3px;color:var(--mut);font-size:13px}
.jg-greeting::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-24px;top:-28px;background:rgba(244,181,63,.12)}
nav.tabs{background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(14,122,79,.14);box-shadow:0 -10px 26px rgba(14,122,79,.09)}
nav.tabs a{position:relative;padding:8px 2px 7px}nav.tabs a .ti{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:30px;padding:0 16px;border-radius:999px;transition:background .2s,transform .15s}
nav.tabs a:active .ti{background:rgba(22,163,74,.24);transform:scale(.9)}
nav.tabs a.on{color:#0a7d43;font-weight:800}nav.tabs a.on::before{content:"";position:absolute;top:-1px;left:50%;width:30px;height:3px;margin-left:-15px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#34d399,#16a34a)}
nav.tabs a.on .ti{background:linear-gradient(135deg,#4ade80 0%,#16a34a 60%,#0e7a4f 100%);box-shadow:0 6px 14px rgba(22,163,74,.40),inset 0 1px 0 rgba(255,255,255,.35)}
.fl{position:fixed;right:16px;width:56px;height:56px;border:0;border-radius:50%;color:#fff;font-size:23px;align-items:center;justify-content:center;z-index:40;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.20);text-decoration:none;display:flex}
.fl-cart{bottom:calc(156px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#16a34a,#0e7a4f)}.fl-order{bottom:calc(224px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#ff9a3d,#e2574c);display:none}
.fc{position:absolute;right:-2px;top:-3px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:#172033;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.fl-ai{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:45;width:58px;height:58px;border:0;border-radius:50%;background:linear-gradient(135deg,#f4b53f,#e2574c);color:#fff;font-size:25px;box-shadow:0 10px 24px rgba(0,0,0,.22);cursor:pointer;display:flex;align-items:center;justify-content:center;animation:aiPulse 2.4s ease-in-out infinite}
@keyframes aiPulse{0%,100%{box-shadow:0 10px 24px rgba(0,0,0,.22)}50%{box-shadow:0 10px 28px rgba(226,87,76,.42),0 0 0 8px rgba(244,181,63,.12)}}
.jg-ambient-icons{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.jg-float-icon{position:absolute;display:block;font-size:clamp(24px,5vw,48px);opacity:.065;user-select:none;animation:jgFloat linear infinite}
.jg-fi1{left:6%;top:17%;animation-duration:31s}.jg-fi2{left:78%;top:12%;animation-duration:38s;animation-delay:-21s}.jg-fi3{left:88%;top:53%;animation-duration:34s;animation-delay:-14s}.jg-fi4{left:11%;top:69%;animation-duration:42s;animation-delay:-30s}.jg-fi5{left:48%;top:7%;animation-duration:37s;animation-delay:-19s}.jg-fi6{left:62%;top:78%;animation-duration:44s;animation-delay:-9s}.jg-fi7{left:30%;top:40%;animation-duration:40s;animation-delay:-25s}.jg-fi8{left:70%;top:30%;animation-duration:36s;animation-delay:-5s}
@keyframes jgFloat{0%{transform:translate3d(0,0,0) rotate(-4deg)}25%{transform:translate3d(22px,-18px,0) rotate(3deg)}50%{transform:translate3d(-12px,-34px,0) rotate(-2deg)}75%{transform:translate3d(-28px,-12px,0) rotate(4deg)}100%{transform:translate3d(0,0,0) rotate(-4deg)}}
header,main{position:relative;z-index:1}body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.slide img{transition:none}}
</style></head><body>
<div class="jg-ambient-icons" aria-hidden="true"><span class="jg-float-icon jg-fi1">🛍️</span><span class="jg-float-icon jg-fi2">🍔</span><span class="jg-float-icon jg-fi3">🚗</span><span class="jg-float-icon jg-fi4">✂️</span><span class="jg-float-icon jg-fi5">🔧</span><span class="jg-float-icon jg-fi6">🧺</span><span class="jg-float-icon jg-fi7">📦</span><span class="jg-float-icon jg-fi8">🛵</span></div>
<header><div class="hrow"><div><div class="logo"><span class="j">Jaji</span><span class="go">Go</span></div><div class="loc">📍 Jaji, Kaduna</div></div><div style="display:flex;gap:8px"><button class="iconbtn" data-a="bell" aria-label="Notifications">🔔<span class="badge" id="nb" style="display:none">0</span></button><button class="iconbtn" data-a="lang" aria-label="Language">🌐</button></div></div>
<div class="searchwrap" id="sb"><div class="searchbar"><span>🔍</span><input id="q" type="search" placeholder="What are you looking for?"></div><button class="aibtn" data-a="ai">✨ Ask JajiGo AI</button></div></header>
<main id="app"><div class="spin"></div></main><div class="toast" id="toast"></div>
<nav class="tabs"><a href="#/home" data-n="home"><span class="ti">🏠</span>Home</a><a href="#/explore" data-n="explore"><span class="ti">🧭</span>Explore</a><a href="#/me" data-n="me"><span class="ti">👤</span>Profile</a></nav>
<a class="fl fl-order" id="flo" href="#/orders" aria-label="Track my orders">🛵<span class="fc" id="flob">0</span></a><a class="fl fl-cart" href="#/cart" aria-label="Open cart">🛒<span class="fc" id="bd" style="display:none">0</span></a><button class="fl-ai" data-a="ai" aria-label="Ask JajiGo AI">🤖</button>
<script>
const S={t:null,u:null,q:'',cat:'',tab:'orders',mode:'login'};
try{S.t=localStorage.getItem('t');S.u=JSON.parse(localStorage.getItem('u')||'null')}catch(e){}
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira=k=>'\u20A6'+(k/100).toLocaleString();
let tt;const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3500)};
let rp=null;
const refresh=()=>rp||(rp=(async()=>{try{const r=await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:localStorage.getItem('r')})});if(!r.ok)return false;const j=await r.json();S.t=j.access_token;localStorage.setItem('t',S.t);localStorage.setItem('r',j.refresh_token);return true}catch(e){return false}finally{rp=null}})());
const api=async(p,o={},retry=true)=>{const r=await fetch('/api'+p,{method:o.method||'GET',headers:Object.assign({'Content-Type':'application/json'},S.t?{Authorization:'Bearer '+S.t}:{}),body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&S.t&&!p.startsWith('/auth/')){if(retry&&localStorage.getItem('r')&&await refresh())return api(p,o,false);A.out()}if(!r.ok)throw new Error(j.error||'Something went wrong');return j};
const val=id=>document.getElementById(id).value.trim();
const need=()=>{if(!S.t){location.hash='#/me';toast('Please log in first');return true}};
const ST=['pending','accepted','preparing','ready','on_the_way','delivered','completed'];
const lab=s=>String(s).replace(/_/g,' ');
const pill=s=>`<span class="pill ${['rejected','cancelled','suspended'].includes(s)?'red':['pending','under_review'].includes(s)?'amber':''}">${esc(lab(s))}</span>`;
const empty=(i,t)=>`<div class="empty"><div class="ei">${i}</div>${esc(t)}</div>`;
const CI={'Food and Restaurants':'🍽️','Groceries':'🛒','Supermarkets':'🏬','Drinks':'🥤','Snacks':'🍿','Fruits and Vegetables':'🥬','Household Products':'🧴','Electronics':'🔌','Phone Accessories':'📱','Fashion':'👗','Beauty and Personal Care':'💄','Daily Needs':'🧺'};
const COL=['#0e7a4f','#e2574c','#3b82f6','#f59e0b','#8b5cf6','#0891b2'];
const logo=s=>s.logo_url?`<div class="vlogo"><img src="${esc(s.logo_url)}" alt=""></div>`:`<div class="vlogo" style="background:${COL[(s.name||'').length%6]}">${esc((s.name||'?')[0].toUpperCase())}</div>`;
const field=(id,l,ph,t)=>`<div class="field"><label>${l}</label><input id="${id}" type="${t||'text'}" placeholder="${ph||''}"></div>`;

async function compress(file,mx){const im=await createImageBitmap(file),k=Math.min(1,(mx||800)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',0.8))}
async function upload(file){const b=await compress(file);const s=await api('/uploads/sign',{method:'POST',body:{bucket:'product-images',filename:'p.jpg'}});const fd=new FormData();fd.append('cacheControl','3600');fd.append('',b);const r=await fetch(s.signed_url,{method:'PUT',body:fd});if(!r.ok)throw new Error('Image upload failed');return s.public_url}

let SHOPS={};
const prods=l=>l.length?`<div class="grid2">${l.map(p=>{const i=(p.product_images||[]).sort((a,b)=>a.sort_order-b.sort_order)[0];const sh=SHOPS[p.business_id];
return `<div class="pcard"><a href="#/product/${p.id}" class="pimg" style="text-decoration:none">${i?`<img loading="lazy" src="${esc(i.image_url)}" alt="">`:'🛍️'}</a><div class="pbody"><a href="#/product/${p.id}" class="pname" style="display:block;color:inherit;text-decoration:none">${esc(p.name)}</a><div class="psub">${esc(sh?sh.name:'')}</div><div class="psub" data-rp="${p.id}" style="min-height:16px"></div><div class="pprice">${p.discount_percent?`<s style="color:var(--mut);font-weight:500;font-size:12px">${naira(p.price_kobo)}</s> `:''}${naira(p.final_price_kobo)}</div><button class="btn sm" style="width:100%" data-a="add" data-id="${p.id}">Add to cart</button></div></div>`}).join('')}</div>`:empty('📦','No products found');

const V={
home:async()=>{const [c,p,s,m,bn]=await Promise.all([api('/shopping/categories'),api('/shopping/products'),api('/shopping/shops'),api('/morning').catch(()=>({products:[]})),api('/banners').catch(()=>({banners:[]}))]);
SHOPS={};s.shops.forEach(x=>SHOPS[x.id]=x);const g=greet(),nm=S.u&&S.u.full_name?', '+esc(S.u.full_name.split(' ')[0]):'';
return `${sliderH(bn.banners)}<div class="jg-greeting"><div class="jg-greet-title">${g[0]} ${g[1]}${nm}</div><div class="jg-greet-sub">Welcome to JajiGo — Jaji, Kaduna</div></div>
${m.products.length?`<a href="#/morning" class="card" style="display:block;text-decoration:none;color:inherit;background:linear-gradient(135deg,#fff8e8,#f3fff9);border-color:#f1e2b8"><b>🌅 Morning Rush</b><div class="mut">${m.products.length} fresh breakfast item${m.products.length==1?'':'s'} available. Tap to order.</div></a>`:''}
<div class="near"><div style="font-weight:800">📍 Find what's near you</div><div class="mut" style="margin:3px 0 9px">Open Google Maps for places close to you.</div><div style="display:flex;gap:8px;flex-wrap:wrap">${[['🏪 Shops','shops near me'],['🏥 Hospitals','hospital near me'],['💊 Pharmacies','pharmacy near me'],['🍽️ Restaurants','restaurant near me']].map(x=>`<a class="chip" href="https://www.google.com/maps/search/${encodeURIComponent(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join('')}</div></div>
<h2 class="sec">🗂️ Categories</h2><div class="cats">${c.categories.map(x=>`<div class="cat" data-a="gocat" data-id="${x.id}"><div class="ci">${CI[x.name]||'🛍️'}</div><div class="cn">${esc(x.name)}</div></div>`).join('')}</div>

const SL={t:null,i:0};
const sliderH=b=>!b.length?`<div class="sl"><div class="slt" style="background:linear-gradient(135deg,#0e7a4f,#0a5c3b);color:#fff;flex-direction:column;justify-content:center;padding:22px"><div style="font-size:24px;font-weight:800">Shop local in Jaji</div><div style="opacity:.9;margin-top:4px">Fresh food, groceries and more, delivered to you.</div></div></div>`:
`<div class="sl"><div class="slt" id="slt">${b.map((x,k)=>{const im=`<img src="${esc(x.image_url)}" alt="${esc(x.title||'')}" ${k?'loading="lazy"':''}>`;return x.product_id?`<a class="slide" href="#/product/${x.product_id}">${im}</a>`:`<div class="slide">${im}</div>`}).join('')}</div>${b.length>1?`<div class="dots" id="dots">${b.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}</div>`;
function startSlider(){clearInterval(SL.t);const t=document.getElementById('slt');if(!t)return;const sl=[...t.children],dots=[...document.querySelectorAll('#dots i')];
const set=i=>{SL.i=i;sl.forEach((s,k)=>s.classList.toggle('on',k===i));dots.forEach((d,k)=>d.classList.toggle('on',k===i))};set(0);
t.addEventListener('scroll',()=>{const i=Math.round(t.scrollLeft/t.clientWidth);if(i!==SL.i)set(i)},{passive:true});if(sl.length<2)return;
let pause=0;['touchstart','pointerdown','wheel'].forEach(ev=>t.addEventListener(ev,()=>{pause=Date.now()+8000},{passive:true}));
SL.t=setInterval(()=>{if(Date.now()<pause||document.hidden)return;t.scrollTo({left:((SL.i+1)%sl.length)*t.clientWidth,behavior:'smooth'})},4500)}
