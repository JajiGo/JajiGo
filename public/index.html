<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7a4f">
<title>JajiGo</title>
<style>
:root{--g:#0e7a4f;--g2:#0a5c3b;--g3:#e7f4ee;--o:#e2574c;--ink:#1c2420;--mut:#6b7770;--bg:#f7fbf8;--card:#fff;--line:#e4e2da;--gold:#f4b53f;--r:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#f7fbf8}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:78px;min-height:100vh;overflow-x:hidden;
background:radial-gradient(ellipse 90% 42% at -10% 12%,rgba(22,163,74,.11),transparent 72%),radial-gradient(ellipse 85% 38% at 112% 32%,rgba(14,122,79,.09),transparent 74%),linear-gradient(180deg,#fff,#f7fbf8 48%,#fff);background-attachment:fixed}
header{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;position:sticky;top:0;z-index:20}
.logo{font-size:24px;font-weight:800;letter-spacing:-1.2px;line-height:1}.logo .j{color:#fff}.logo .go{color:#86efac;position:relative}
.logo .go:after{content:'\27A4';position:absolute;color:#ff9a3d;font-size:.36em;right:.03em;top:-.78em;transform:rotate(-18deg)}
.loc{font-size:12.5px;opacity:.92;margin-top:3px}
.searchbar{display:flex;align-items:center;background:#fff;border-radius:12px;padding:0 12px;height:46px;gap:8px;margin-top:10px}
.searchbar input{border:none;outline:none;flex:1;font-size:15px;height:100%;background:transparent;color:var(--ink)}
main{padding:14px 14px 20px;max-width:560px;margin:0 auto}
h2.sec{font-size:16.5px;font-weight:800;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:0 8px 24px rgba(14,122,79,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 6px;text-align:center;cursor:pointer;box-shadow:0 8px 24px rgba(14,122,79,.06)}
.cat.on{border-color:var(--g);background:var(--g3)}.cat:active{transform:scale(.97)}.cat .ci{font-size:26px}.cat .cn{font-size:12.5px;font-weight:600;margin-top:4px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 24px rgba(14,122,79,.06)}
.pimg{height:120px;display:flex;align-items:center;justify-content:center;font-size:44px;background:#f3f0e8;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:9px 10px 11px}.pname{font-size:13.5px;font-weight:700;line-height:1.25}.psub{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pprice{font-size:14px;font-weight:800;color:var(--g);margin:4px 0 7px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px;display:flex;gap:11px;align-items:center;margin-bottom:10px;color:inherit;text-decoration:none;box-shadow:0 8px 24px rgba(14,122,79,.06)}
.vlogo{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none;color:#fff;background:var(--g)}.vlogo img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.vname{font-size:14.5px;font-weight:700}.vmeta{font-size:12px;color:var(--mut);margin-top:1px}
.btn{background:linear-gradient(135deg,#16a34a,#0e7a4f 55%,#0a5c3b);color:#fff;border:none;border-radius:14px;height:48px;font-size:15.5px;font-weight:700;width:100%;cursor:pointer;box-shadow:0 8px 18px rgba(14,122,79,.25);font-family:inherit;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.sec{background:var(--g3);color:var(--g);box-shadow:none}.btn.warn{background:var(--o)}.btn.sm{height:36px;font-size:13px;width:auto;padding:0 14px;border-radius:10px}.btn:disabled{opacity:.5}.btn:active{opacity:.85}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.g1{flex:1;min-width:0}
.pill{display:inline-flex;background:var(--g3);color:var(--g);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}.pill.red{background:#fdebe9;color:var(--o)}.pill.amber{background:#fdf3e0;color:#a06514}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;flex:1}.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.tabs2{display:flex;gap:7px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.field{margin-bottom:12px}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;background:#fff;outline:none;color:var(--ink);font-family:inherit}.field textarea{height:80px;padding:10px 12px}
.field input[type=file]{padding:9px 12px}.field input[type=checkbox]{width:auto;height:auto}
.total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14.5px}.total-row.big{font-weight:800;font-size:17px;border-top:1.5px solid var(--line);margin-top:5px;padding-top:11px}
.stepper{display:flex;align-items:center;gap:2px}.stepper button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:700;color:var(--g)}.stepper span{min-width:34px;text-align:center;font-weight:700}
.statusbar{display:flex;gap:4px;margin:12px 0 6px}.statusbar div{flex:1;height:6px;border-radius:3px;background:var(--line)}.statusbar div.on{background:var(--g)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}.stat .sv{font-size:19px;font-weight:800;color:var(--g)}.stat .sl{font-size:11.5px;color:var(--mut)}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.code{font-size:30px;letter-spacing:8px;text-align:center;font-weight:800;color:var(--g);margin-top:4px}
.mut{color:var(--mut);font-size:13px}.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty .ei{font-size:44px;margin-bottom:8px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;margin:24px auto}@keyframes sp{to{transform:rotate(360deg)}}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:10.5px;color:var(--mut);text-decoration:none}nav.tabs a .ti{font-size:21px;line-height:1}nav.tabs a.on{color:var(--g);font-weight:700}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;max-width:88%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:.95}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><div class="logo"><span class="j">Jaji</span><span class="go">Go</span></div><div class="loc">📍 Jaji, Kaduna</div>
<div class="searchbar" id="sb"><span>🔍</span><input id="q" type="search" placeholder="What are you looking for?"></div></header>
<main id="app"><div class="spin"></div></main><div class="toast" id="toast"></div>
<nav class="tabs"><a href="#/home" data-n="home"><span class="ti">🏠</span>Home</a><a href="#/cart" data-n="cart"><span class="ti">🛒</span>Cart<span id="bd"></span></a><a href="#/orders" data-n="orders"><span class="ti">📦</span>Orders</a><a href="#/me" data-n="me"><span class="ti">👤</span>Profile</a></nav>
<script>
const S={t:null,u:null,q:'',cat:'',tab:'orders',mode:'login'};
try{S.t=localStorage.getItem('t');S.u=JSON.parse(localStorage.getItem('u')||'null')}catch(e){}
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira=k=>'\u20A6'+(k/100).toLocaleString();
let tt;const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3500)};
const api=async(p,o={})=>{const r=await fetch('/api'+p,{method:o.method||'GET',headers:Object.assign({'Content-Type':'application/json'},S.t?{Authorization:'Bearer '+S.t}:{}),body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&S.t){A.out()}if(!r.ok)throw new Error(j.error||'Something went wrong');return j};
const val=id=>document.getElementById(id).value.trim();
const need=()=>{if(!S.t){location.hash='#/me';toast('Please log in first');return true}};
const ST=['pending','accepted','preparing','ready','on_the_way','delivered','completed'];
const lab=s=>String(s).replace(/_/g,' ');
const pill=s=>`<span class="pill ${['rejected','cancelled','suspended'].includes(s)?'red':['pending','under_review'].includes(s)?'amber':''}">${esc(lab(s))}</span>`;
const empty=(i,t)=>`<div class="empty"><div class="ei">${i}</div>${esc(t)}</div>`;
const CI={'Food and Restaurants':'🍽️','Groceries':'🛒','Supermarkets':'🏬','Drinks':'🥤','Snacks':'🍿','Fruits and Vegetables':'🥬','Household Products':'🧴','Electronics':'🔌','Phone Accessories':'📱','Fashion':'👗','Beauty and Personal Care':'💄','Daily Needs':'🧺'};
const COL=['#0e7a4f','#e2574c','#3b82f6','#f59e0b','#8b5cf6','#0891b2'];
const logo=s=>s.logo_url?`<div class="vlogo"><img src="${esc(s.logo_url)}" alt=""></div>`:`<div class="vlogo" style="background:${COL[(s.name||'').length%6]}">${esc((s.name||'?')[0].toUpperCase())}</div>`;
const field=(id,l,ph,t)=>`<div class="field"><label>${l}</label><input id="${id}" type="${t||'text'}" placeholder="${ph||''}"></div>`;

async function compress(file){const im=await createImageBitmap(file),k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',0.8))}
async function upload(file){const b=await compress(file);const s=await api('/uploads/sign',{method:'POST',body:{bucket:'product-images',filename:'p.jpg'}});const fd=new FormData();fd.append('cacheControl','3600');fd.append('',b);const r=await fetch(s.signed_url,{method:'PUT',body:fd});if(!r.ok)throw new Error('Image upload failed');return s.public_url}

let SHOPS={};
const prods=l=>l.length?`<div class="grid2">${l.map(p=>{const i=(p.product_images||[]).sort((a,b)=>a.sort_order-b.sort_order)[0];const sh=SHOPS[p.business_id];
return `<div class="pcard"><div class="pimg">${i?`<img loading="lazy" src="${esc(i.image_url)}" alt="">`:'🛍️'}</div><div class="pbody"><div class="pname">${esc(p.name)}</div><div class="psub">${esc(sh?sh.name:'')}</div><div class="pprice">${p.discount_percent?`<s style="color:var(--mut);font-weight:500;font-size:12px">${naira(p.price_kobo)}</s> `:''}${naira(p.final_price_kobo)}</div><button class="btn sm" style="width:100%" data-a="add" data-id="${p.id}">Add to cart</button></div></div>`}).join('')}</div>`:empty('📦','No products found');

const V={
home:async()=>{const [c,p,s]=await Promise.all([api('/shopping/categories'),api('/shopping/products?'+new URLSearchParams({q:S.q,category_id:S.cat})),api('/shopping/shops')]);
SHOPS={};s.shops.forEach(x=>SHOPS[x.id]=x);
return `<h2 class="sec" style="margin-top:2px">🗂️ Categories</h2><div class="cats">${c.categories.map(x=>`<div class="cat ${S.cat==x.id?'on':''}" data-a="cat" data-id="${S.cat==x.id?'':x.id}"><div class="ci">${CI[x.name]||'🛍️'}</div><div class="cn">${esc(x.name)}</div></div>`).join('')}</div>
<h2 class="sec">⭐ Shops near you</h2>${s.shops.length?s.shops.map(x=>`<a class="vcard" href="#/shop/${x.id}">${logo(x)}<div class="g1"><div class="vname">${esc(x.name)}</div><div class="vmeta">${esc(x.address||'Jaji')} · ${x.offers_delivery?'Delivery':'Pickup'}</div></div></a>`).join(''):empty('🏪','No shops yet')}
<h2 class="sec">🔥 ${S.q?'Results for “'+esc(S.q)+'”':'Products'}</h2>${prods(p.products)}`},
shop:async id=>{const d=await api('/shopping/shops/'+id);SHOPS[d.shop.id]=d.shop;return `<a href="#/home" class="mut" style="text-decoration:none;font-weight:700;color:var(--g2)">‹ Back</a><div class="vcard" style="margin-top:8px">${logo(d.shop)}<div class="g1"><div class="vname">${esc(d.shop.name)}</div><div class="vmeta">${esc(d.shop.description||'')}</div><div class="vmeta">${esc(d.shop.address||'')}</div></div></div>${prods(d.products)}`},
cart:async()=>{if(!S.t)return need()||'';const c=await api('/shopping/cart');if(!c.items.length)return empty('🛒','Your cart is empty');
return `<h2 class="sec" style="margin-top:2px">🛒 Your cart</h2>`+c.items.map(i=>`<div class="card row"><div class="g1"><div class="vname">${esc(i.name)}</div><div class="vmeta">${naira(i.unit_price_kobo)} ${i.in_stock?'':'<span style="color:var(--o)">· not enough stock</span>'}</div></div><div class="stepper"><button data-a="qty" data-id="${i.product_id}" data-q="${i.quantity-1}">−</button><span>${i.quantity}</span><button data-a="qty" data-id="${i.product_id}" data-q="${i.quantity+1}">+</button></div></div>`).join('')+
`<div class="card"><div class="total-row"><span>Subtotal</span><b>${naira(c.subtotal_kobo)}</b></div><div class="mut">Delivery fee is added at checkout</div><div style="height:10px"></div>
<div class="field"><label>How do you want it?</label><select id="ful"><option value="delivery">Delivery</option><option value="pickup">I will pick it up</option></select></div>
<div class="field"><label>Delivery address</label><textarea id="addr" placeholder="House/block, street, Jaji"></textarea></div><button class="btn" data-a="order">Place order</button></div>`},
orders:async()=>{if(!S.t)return need()||'';const d=await api('/shopping/orders');if(!d.orders.length)return empty('📦','No orders yet');
return `<h2 class="sec" style="margin-top:2px">📦 My orders</h2>`+d.orders.map(o=>`<a href="#/order/${o.id}" class="vcard">${logo(o.businesses||{name:'?'})}<div class="g1"><div class="vname">${esc(o.businesses&&o.businesses.name)}</div><div class="vmeta">${new Date(o.created_at).toLocaleString()}</div></div><div style="text-align:right"><b style="color:var(--g)">${naira(o.total_kobo)}</b><br>${pill(o.status)}</div></a>`).join('')},
order:async id=>{const {order:o}=await api('/shopping/orders/'+id);const final=['completed','cancelled','rejected'].includes(o.status);const i=ST.indexOf(o.status);
return `<a href="#/orders" class="mut" style="text-decoration:none;font-weight:700;color:var(--g2)">‹ Orders</a>
<div class="card" style="margin-top:8px"><div class="row"><b>${esc(o.businesses.name)}</b>${pill(o.status)}</div><div class="mut">${esc(o.businesses.address||'')} ${esc(o.businesses.phone||'')}</div>
${i>=0?`<div class="statusbar">${ST.map((s,k)=>`<div class="${k<=i?'on':''}"></div>`).join('')}</div><div class="mut">${esc(lab(o.status))}</div>`:''}</div>
<div class="card">${o.order_items.map(x=>`<div class="total-row"><span>${x.quantity} × ${esc(x.name)}</span><span>${naira(x.unit_price_kobo*x.quantity)}</span></div>`).join('')}<div class="total-row"><span>Delivery fee</span><span>${naira(o.delivery_fee_kobo)}</span></div><div class="total-row big"><span>Total</span><span>${naira(o.total_kobo)}</span></div><div class="mut">Payment is added in a later update.</div></div>
${final?'':`<div class="card"><div class="mut">Your delivery code. Give it only when you receive your order:</div><div class="code">${esc(o.delivery_code)}</div></div>`}
${o.status==='pending'?`<button class="btn warn" data-a="cancel" data-id="${o.id}">Cancel order</button>`:''}
${o.status==='delivered'?`<button class="btn" data-a="complete" data-id="${o.id}">I received my order</button>`:''}
${['delivered','completed'].includes(o.status)?`<button class="btn sec" data-a="review" data-id="${o.id}" style="margin-top:8px">⭐ Rate this order</button>`:''}`},
me:async()=>{if(!S.t)return `<div class="card"><div class="tabs2"><button class="chip ${S.mode==='login'?'on':''}" data-a="mode" data-id="login">Log in</button><button class="chip ${S.mode==='signup'?'on':''}" data-a="mode" data-id="signup">Sign up</button></div>`+
(S.mode==='login'?field('le','Email','you@email.com','email')+field('lp','Password','Your password','password')+'<button class="btn" data-a="login">Log in</button>'
:field('sn','Full name','Your name')+field('se','Email','you@email.com','email')+field('sph','Phone','0803…','tel')+field('sp','Password','8+ characters','password')+'<button class="btn" data-a="signup">Create account</button>')+'</div>';
const d=await api('/me');S.u=d.user;localStorage.setItem('u',JSON.stringify(d.user));const sh=d.businesses.find(b=>b.marketplace==='shopping');
return `<div class="card row"><div class="vlogo">${esc((d.user.full_name||'?')[0].toUpperCase())}</div><div class="g1"><div class="vname">${esc(d.user.full_name)}</div><div class="vmeta">${esc(d.user.email)} · ${esc(d.user.phone)}</div></div>${pill(d.user.role)}</div>
${d.user.role==='admin'?'<a class="btn" href="#/admin" style="margin-bottom:10px">🛡️ Admin dashboard</a>':''}
${sh?`<div class="card"><div class="row"><b>🏪 ${esc(sh.name)}</b>${pill(sh.verification)}</div>${sh.rejection_reason?`<div class="mut">Reason: ${esc(sh.rejection_reason)}</div>`:''}${sh.verification==='approved'?'<a class="btn" href="#/seller" style="margin-top:10px">Open seller dashboard</a>':''}</div>`:
`<div class="card"><h2 class="sec" style="margin-top:0">🏪 Sell on JajiGo</h2>${field('bn','Shop name')}<div class="field"><label>What do you sell?</label><textarea id="bd2"></textarea></div>${field('ba','Shop address')}${field('bp','Shop phone','','tel')}<div class="field"><label><input type="checkbox" id="bdl"> I deliver orders</label></div><button class="btn" data-a="reg">Apply as a seller</button><div class="mut" style="margin-top:8px">An admin reviews every shop before it goes live. Service-provider registration is coming soon.</div></div>`}
<button class="btn sec" data-a="out">Log out</button>`},
seller:async()=>{const s=await api('/seller/summary');const c=s.order_counts;
const head=`<div class="card"><b>🏪 ${esc(s.shop.name)}</b></div><div class="statgrid"><div class="stat"><div class="sv">${naira(s.total_sales_kobo)}</div><div class="sl">Total sales</div></div><div class="stat"><div class="sv">${c.pending||0}</div><div class="sl">New orders</div></div></div>
<div class="tabs2"><button class="chip ${S.tab==='orders'?'on':''}" data-a="tab" data-id="orders">Orders</button><button class="chip ${S.tab==='products'?'on':''}" data-a="tab" data-id="products">Products</button></div>`;
if(S.tab==='products'){const [p,c2]=await Promise.all([api('/seller/products'),api('/shopping/categories')]);
return head+`<div class="card"><h2 class="sec" style="margin-top:0">➕ Add product</h2>${field('pn','Product name')}${field('pp','Price in naira','','number')}${field('ps','Stock quantity','','number')}<div class="field"><label>Category</label><select id="pc">${c2.categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Photo</label><input id="pi" type="file" accept="image/*"></div><button class="btn" data-a="addp">Save product</button></div>`+
p.products.map(x=>{const i=(x.product_images||[])[0];return `<div class="vcard"><div class="vlogo" style="background:#f3f0e8">${i?`<img src="${esc(i.image_url)}" alt="">`:'🛍️'}</div><div class="g1"><div class="vname">${esc(x.name)}</div><div class="vmeta">${naira(x.price_kobo)} · stock ${x.stock}${x.is_available?'':' · hidden'}</div></div><button class="btn sm warn" data-a="delp" data-id="${x.id}">Delete</button></div>`}).join('')}
const d=await api('/seller/orders');
return head+(d.orders.length?d.orders.map(o=>`<div class="card"><div class="row"><b>${esc(o.profiles&&o.profiles.full_name)}</b>${pill(o.status)}</div><div class="mut">${esc(o.profiles&&o.profiles.phone)} · ${lab(o.fulfilment)} ${esc(o.delivery_address||'')}</div><div style="margin:6px 0">${o.order_items.map(x=>`<div>${x.quantity} × ${esc(x.name)}</div>`).join('')}</div><div class="row"><b style="color:var(--g)">${naira(o.total_kobo)}</b><span style="display:flex;gap:6px">${acts(o)}</span></div></div>`).join(''):empty('📭','No orders yet'))},
admin:async()=>{const d=await api('/admin/businesses');return `<h2 class="sec" style="margin-top:2px">🛡️ Applications</h2>`+(d.businesses.map(b=>`<div class="card"><div class="row"><b>${esc(b.name)}</b>${pill(b.verification)}</div><div class="mut">${b.marketplace} · ${esc(b.address||'')} · ${esc(b.phone||'')}</div><div class="mut">${esc(b.description||'')}</div><div class="row" style="margin-top:10px;justify-content:flex-start"><button class="btn sm" data-a="ver" data-id="${b.id}" data-s="approved">Approve</button><button class="btn sm sec" data-a="ver" data-id="${b.id}" data-s="under_review">Review</button><button class="btn sm warn" data-a="ver" data-id="${b.id}" data-s="rejected">Reject</button></div></div>`).join('')||empty('📋','None yet'))}
};
const acts=o=>{const b=(s,t,c)=>`<button class="btn sm ${c||''}" data-a="st" data-id="${o.id}" data-s="${s}">${t}</button>`;
return {pending:b('accepted','Accept')+b('rejected','Reject','warn'),accepted:b('preparing','Preparing'),preparing:b('ready','Ready'),ready:(o.fulfilment==='delivery'?b('on_the_way','On the way'):'')+b('delivered','Delivered'),on_the_way:b('delivered','Delivered')}[o.status]||''};

const A={
search:()=>{S.q=val('q');route()},cat:(id)=>{S.cat=id;route()},tab:(id)=>{S.tab=id;route()},mode:(id)=>{S.mode=id;route()},
add:async id=>{if(need())return;const c=await api('/shopping/cart');const q=((c.items.find(i=>i.product_id===id)||{}).quantity||0)+1;await api('/shopping/cart',{method:'PUT',body:{product_id:id,quantity:q}});toast('Added to cart');badge()},
qty:async(id,el)=>{await api('/shopping/cart',{method:'PUT',body:{product_id:id,quantity:Number(el.dataset.q)}});route()},
order:async()=>{const f=val('ful');const r=await api('/shopping/orders',{method:'POST',body:{fulfilment:f,delivery_address:f==='delivery'?val('addr'):undefined}});toast('Order placed!');location.hash='#/order/'+r.orders[0].id},
cancel:async id=>{if(!confirm('Cancel this order?'))return;await api('/shopping/orders/'+id+'/cancel',{method:'POST'});route()},
complete:async id=>{await api('/shopping/orders/'+id+'/complete',{method:'POST'});route()},
review:async id=>{const r=Number(prompt('Rating 1 to 5'));if(!r)return;await api('/shopping/orders/'+id+'/review',{method:'POST',body:{rating:r,comment:prompt('Comment (optional)')||undefined}});toast('Thanks for your review')},
login:async()=>{const r=await api('/auth/login',{method:'POST',body:{email:val('le'),password:val('lp')}});sess(r)},
signup:async()=>{await api('/auth/signup',{method:'POST',body:{email:val('se'),password:val('sp'),full_name:val('sn'),phone:val('sph')}});const r=await api('/auth/login',{method:'POST',body:{email:val('se'),password:val('sp')}});sess(r)},
out:()=>{S.t=null;S.u=null;localStorage.clear();location.hash='#/me';route()},
reg:async()=>{await api('/businesses/register',{method:'POST',body:{marketplace:'shopping',name:val('bn'),description:val('bd2')||undefined,address:val('ba')||undefined,phone:val('bp')||undefined,offers_delivery:document.getElementById('bdl').checked}});toast('Submitted for review');route()},
st:async(id,el)=>{const s=el.dataset.s,b={status:s};if(s==='delivered')b.code=prompt('Enter the customer\'s 6-digit delivery code');if(s==='rejected')b.reason=prompt('Reason for rejecting');if(s==='delivered'&&!b.code)return;if(s==='rejected'&&!b.reason)return;await api('/seller/orders/'+id+'/status',{method:'PATCH',body:b});route()},
addp:async()=>{const f=document.getElementById('pi').files[0];const body={name:val('pn'),price_kobo:Math.round(Number(val('pp'))*100),stock:Number(val('ps')),category_id:Number(val('pc'))};if(f){toast('Uploading photo…');body.image_urls=[await upload(f)]}await api('/seller/products',{method:'POST',body});toast('Product saved');route()},
delp:async id=>{if(!confirm('Delete this product?'))return;await api('/seller/products/'+id,{method:'DELETE'});route()},
ver:async(id,el)=>{const s=el.dataset.s,b={status:s};if(s==='rejected'){b.reason=prompt('Reason for rejecting');if(!b.reason)return}await api('/admin/businesses/'+id+'/verification',{method:'PATCH',body:b});route()}
};
function sess(r){S.t=r.access_token;S.u=r.user;localStorage.setItem('t',S.t);localStorage.setItem('u',JSON.stringify(r.user));location.hash='#/home';route()}
async function badge(){const e=document.getElementById('bd');if(!S.t){e.textContent='';return}try{const c=await api('/shopping/cart');const n=c.items.reduce((s,i)=>s+i.quantity,0);e.textContent=n?' ('+n+')':''}catch(x){}}
async function route(){const[p,id]=location.hash.slice(2).split('/');const k=V[p]?p:'home';
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===({shop:'home',order:'orders',seller:'me',admin:'me'}[k]||k)));
document.getElementById('sb').style.display=k==='home'?'flex':'none';
app.innerHTML='<div class="spin"></div>';try{app.innerHTML=await V[k](id)}catch(e){app.innerHTML=empty('⚠️',e.message)}badge()}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;el.disabled=true;try{await A[el.dataset.a](el.dataset.id,el)}catch(x){toast(x.message)}el.disabled=false});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')A.search()});
window.addEventListener('hashchange',route);route();
</script></body></html>
